# ─────────────────────────────────────────────────────────
#  nginx.conf — Production Reverse-Proxy Configuration
#  for Swapify (Node.js / Express on port 3000)
# ─────────────────────────────────────────────────────────
#
#  USAGE:
#    1. Replace YOUR_DOMAIN with your actual domain name.
#    2. Place your SSL certificate files at the paths below
#       (or update the paths to match your setup).
#    3. Copy this file to /etc/nginx/sites-available/swapify
#       and symlink it: ln -s /etc/nginx/sites-available/swapify /etc/nginx/sites-enabled/
#    4. Test: nginx -t
#    5. Reload: systemctl reload nginx
# ─────────────────────────────────────────────────────────

# ── Redirect all HTTP → HTTPS ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name swapify www.swapify.cloud;

    # Redirect every HTTP request to HTTPS (301 Permanent)
    return 301 https://$host$request_uri;
}

# ── HTTPS Server Block ─────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name swapify.cloud www.swapify.cloud;

    # ── SSL Certificate ────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/swapify-fullchain.pem;
    ssl_certificate_key /etc/ssl/private/swapify-privkey.pem;

    # ── SSL Configuration (modern best practices) ──────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security Headers ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Proxy to Node.js/Express ───────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward real client info to Express
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # ── Serve static assets directly (performance) ─────────
    location /css/ {
        alias /var/www/swapify/public/css/;
        expires 30d;
        access_log off;
    }

    location /js/ {
        alias /var/www/swapify/public/js/;
        expires 30d;
        access_log off;
    }

    location /img/ {
        alias /var/www/swapify/public/img/;
        expires 30d;
        access_log off;
    }

    location /uploads/ {
        alias /var/www/swapify/public/uploads/;
        expires 7d;
        access_log off;
    }

    # ── Max upload size (matches multer 5MB limit) ─────────
    client_max_body_size 10M;
}
